interface:
  display_name: "打包并发布 Rambo"
  short_description: "双平台打包、运行时校验并发布 Rambo 至 GitHub Release"
  default_prompt: "使用 $rambo-release，分别在 macOS ARM64 与 Windows x64 原生构建机生成带对应 Codex App Server 的产物，更新本机 /Applications/Rambo.app，校验双平台安装包后提交版本、创建 GitHub tag 和 Release，并核验发布结果。"
policy:
  allow_implicit_invocation: false
