interface:
  display_name: "打包并发布 Rambo"
  short_description: "macOS 本地校验、Windows 原生 CI 构建并发布 Rambo"
  default_prompt: "使用 $rambo-release，在 macOS ARM64 本地严格构建和校验，并采用 Windows x64 成功的原生 CI 构建产物；更新本机 /Applications/Rambo.app，提交版本、创建 GitHub tag 和 Release，只核对 Release 资产清单，不在 macOS 侧展开或校验 Windows 包。"
policy:
  allow_implicit_invocation: false
