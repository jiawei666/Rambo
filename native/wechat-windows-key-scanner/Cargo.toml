[package]
name = "rambo-wechat-key-scanner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Threading"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
