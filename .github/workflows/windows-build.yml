name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - package.json
      - package-lock.json
      - config/**
      - scripts/**
      - src/**
      - native/**
      - tests/backend/**
      - .github/workflows/windows-build.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - config/**
      - scripts/**
      - src/**
      - native/**
      - tests/backend/**
      - .github/workflows/windows-build.yml

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Windows platform tests
        run: >-
          node --test
          tests/backend/platform-helpers.test.mjs
          tests/backend/platform-paths.test.mjs
          tests/backend/platform-process.test.mjs
          tests/backend/platform-target.test.mjs
          tests/backend/platform-archive.test.mjs
          tests/backend/platform-fs.test.mjs
          tests/backend/desktop-shell.test.mjs
          tests/backend/login-item.test.mjs
          tests/backend/system-indicators.test.mjs
          tests/backend/release-package.test.mjs
      - name: Build Windows NSIS and portable release candidate
        run: npm run release:package -- win32-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Rambo-windows-x64-candidate
          path: |
            dist/release
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows assets to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          draft_state=""
          for attempt in {1..60}; do
            draft_state="$(
              gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null ||
                true
            )"
            if [[ "$draft_state" == "true" ]]; then
              break
            fi
            sleep 10
          done
          if [[ "$draft_state" != "true" ]]; then
            echo "::error::Draft release $GITHUB_REF_NAME is not available"
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          release_dir="dist/release/v${version}"
          gh release upload "$GITHUB_REF_NAME" \
            "${release_dir}/Rambo-v${version}-Windows-x64.exe" \
            "${release_dir}/Rambo-v${version}-Windows-x64.exe.sha256" \
            "${release_dir}/Rambo-v${version}-Windows-x64-portable.zip" \
            "${release_dir}/Rambo-v${version}-Windows-x64-portable.zip.sha256" \
            --clobber
